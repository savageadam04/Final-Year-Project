<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> DispatchIQ - User Creation</title>
        <link rel="stylesheet" href="Style.css">
    </head>
<body>

<div class="container">
<header class="header">    
<h1>DispatchIQ</h1>
<span>User Creation Page</span>
</header>

<main claass="main-content"> 
    <div class="page-heading">
        <h2> Create User Account</h2>
        <p> Create a new user account for DispatchIQ.</p>
        </div>
<section class="form-card">
<form id ="DispatchIQcreationForm">

<div class="form-group">
  <label for="fullname">Full Name:</label><br>
  <input 
  type="text"
  id="fullname"
  name="fullname"
  placeholder="Enter full name"
  required><br><br>
  </div>

<div class="form-group">
  <label for="email">Email Address:</label><br>
  <input 
  type="email" 
  id="email" 
  name="email" 
  placeholder="Enter email address"
  required><br><br>
  </div>

<div class="form-group">
  <label for="role">User Role:</label><br>
  <select id="role" name="role" required>
        <option value="field_engineer" selected>Field Engineer</option>
        <option value="workshop_manager">Workshop Manager</option>
        <option value="service_coordinator">Service Co-Ordinator</option>
        <option value="support_staff">Support Staff</option>
    </select><br><br>
    </div>
  
    <div class="form-group">
  <label for="pwd">Initial Password:</label><br>
  <input 
  type="password" 
  id="pwd" 
  name="pwd"
  placeholder="Enter initial password"
  required><br><br>
  </div>

  <div class="form-actions">
  <input type="submit" value="Create Account">
  <a href="dashboard.html" class="cancel-link">Cancel</a>
  </div>
</form>
</section>
</main>
</div>
<script src="AccountRegistration.js"></script>
</body>
</html>
