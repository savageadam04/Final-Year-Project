<!DOCTYPE html>
<html>
<body>

<h2>User Creation Page</h2>

<form>
  <label for="fullname">Full Name:</label><br>
  <input type="text" id="fullname" name="fullname"><br><br>

  <label for="email">Email Address:</label><br>
  <input type="text" id="email" name="email" ><br><br>

  <label for="role">User Role:</label><br>
  <select>
        <option value="Field Engineer" selected>Field Engineer</option>
        <option value="Workshop Manager">Workshop Manager</option>
        <option value="Service Co-Ordinator">Service Co-Ordinator</option>
        <option value="Support Staff">Support Staff</option>
    </select><br><br>
  
  <label for="pwd">Initial Password:</label><br>
  <input type="password" id="pwd" name="pwd"><br><br>

</form>

 <input type="submit" value="Submit">

</form>
</body>
</html>
